# 每次推送和每个指向 main 的 PR：构建检查、完整端到端测试、无障碍扫描、和线上版本的影子对比。
# Every push and every pull request to main: build check, the full end-to-end suite, the accessibility sweep,
# and a shadow comparison of this build against the live site. Runs in parallel after the build check.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.64.1"
  PILLOW_VERSION: "12.3.0"
  AXE_VERSION: "4.14.0"

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # build_site.py also runs the design-system lint, the safety rules and the banned-phrase list
      - run: pip install "pillow==${PILLOW_VERSION}"
      - name: Build, and check public/ was rebuilt before committing
        run: |
          python3 src/build_site.py
          git status --porcelain public/
          test -z "$(git status --porcelain public/)"

  e2e:
    name: End-to-end tests (tests/test_site.py)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "playwright==${PLAYWRIGHT_VERSION}" "pillow==${PILLOW_VERSION}"
      - run: python3 -m playwright install --with-deps chromium
      - name: Run the suite
        run: |
          set -o pipefail
          python3 tests/test_site.py 2>&1 | tee test-log.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## End-to-end tests"
            echo ""
            echo "$(grep -c '^PASS' test-log.txt || true) passed, $(grep -c '^FAIL' test-log.txt || true) failed. Last line: \`$(tail -n 1 test-log.txt)\`"
            grep '^FAIL' test-log.txt | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test-log.txt

  a11y:
    name: Accessibility sweep (axe, overflow)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "playwright==${PLAYWRIGHT_VERSION}"
      - run: python3 -m playwright install --with-deps chromium
      - run: npm install --no-save --no-audit --no-fund "axe-core@${AXE_VERSION}"
      - run: python3 tests/a11y_sweep.py

  shadow:
    name: Shadow test against the live site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "playwright==${PLAYWRIGHT_VERSION}"
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/shadow_diff.py https://bbpouq.github.io/mushroom-guide/
